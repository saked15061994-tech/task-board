<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do List Board</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mut:#6b7488;--line:#e2e6ef;--pri:#2f6fed;--pri-tx:#fff;--ok:#1f9d63;--okbg:#e5f6ee;--bad:#d64545;--badbg:#fdeaea;--warn:#b7791f;--warnbg:#fdf3dc;--g1:#ffeef3;--g2:#e8f3ff;--hill:#c6ebc9;--hill2:#aedcb3;--paw:#f08aa5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--tx:#eaeef7;--mut:#96a0b5;--line:#2b3242;--pri:#5b8cff;--pri-tx:#0c1220;--ok:#4cc790;--okbg:#17342a;--bad:#ff7b7b;--badbg:#3a1f22;--warn:#f0b957;--warnbg:#3a2e14;--g1:#231b2b;--g2:#132230;--hill:#24402f;--hill2:#1d3527;--paw:#b98bd9}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--tx:#eaeef7;--mut:#96a0b5;--line:#2b3242;--pri:#5b8cff;--pri-tx:#0c1220;--ok:#4cc790;--okbg:#17342a;--bad:#ff7b7b;--badbg:#3a1f22;--warn:#f0b957;--warnbg:#3a2e14;--g1:#231b2b;--g2:#132230;--hill:#24402f;--hill2:#1d3527;--paw:#b98bd9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--g1),var(--g2));background-attachment:fixed;min-height:100vh;color:var(--tx);font-family:"Noto Sans Thai","Sarabun","Tahoma",system-ui,sans-serif;line-height:1.5}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:20px 16px 200px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-weight:500;cursor:pointer}
.tab.on{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
.badge{display:inline-block;min-width:22px;padding:0 7px;margin-left:6px;border-radius:99px;background:var(--badbg);color:var(--bad);font-size:.78rem;font-weight:700}
.tab.on .badge{background:rgba(255,255,255,.25);color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr auto;gap:10px;align-items:end}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:4px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--pri);outline-offset:-1px}
button{font:inherit;cursor:pointer}
.btn{padding:10px 16px;border:0;border-radius:10px;background:var(--pri);color:var(--pri-tx);font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.sec h2{font-size:1rem;margin:0}
.count{color:var(--mut);font-size:.85rem}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.task.over{border-left-color:var(--bad)}.task.soon{border-left-color:var(--warn)}.task.done{border-left-color:var(--ok);opacity:.85}
.task .main{flex:1;min-width:0}
.title{font-weight:700;word-break:break-word}
.task.done .title{text-decoration:line-through;color:var(--mut)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mut);font-size:.85rem;margin-top:4px}
.pill{padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:700}
.pill.over{background:var(--badbg);color:var(--bad)}.pill.soon{background:var(--warnbg);color:var(--warn)}.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.doing{background:color-mix(in srgb,var(--pri) 16%,transparent);color:var(--pri)}
.pill.fin{background:color-mix(in srgb,#0e9aa7 18%,transparent);color:#0e9aa7}
.sm.cur{color:#fff;font-weight:700}
.sm.st-doing.cur{background:var(--pri);border-color:var(--pri);color:var(--pri-tx)}
.sm.st-finished.cur{background:#0e9aa7;border-color:#0e9aa7}
.sm.st-submitted.cur{background:var(--ok);border-color:var(--ok)}
.stat.doing b{color:var(--pri)}.stat.fin b{color:#0e9aa7}
.acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.sm{padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:.85rem}
.sm.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.sm.del{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:24px;border:1px dashed var(--line);border-radius:12px}
.lock{max-width:340px;margin:30px auto;text-align:center}
.lock input{text-align:center;letter-spacing:.4em;font-size:1.4rem;margin:12px 0}
.err{color:var(--bad);font-size:.85rem;min-height:1.3em}
.note{background:var(--warnbg);color:var(--warn);padding:10px 14px;border-radius:10px;font-size:.88rem;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.link{background:none;border:0;color:var(--pri);font-size:.85rem;padding:4px}

.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx .paws{position:absolute;inset:0;width:100%;height:100%;opacity:.13;color:var(--paw)}
.pets{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;max-height:190px}
.hill{fill:var(--hill)}.hill2{fill:var(--hill2)}
.fish{position:absolute;left:0;animation-timing-function:linear;animation-iteration-count:infinite;opacity:.95}
.fish.big{width:96px;height:64px}.fish.sm{width:46px;height:31px}
.fish.L{animation-name:swimL}.fish.R{animation-name:swimR}
.fish svg{width:100%;height:100%;overflow:visible;animation:bob 3s ease-in-out infinite}
@keyframes swimR{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 140px))}}
@keyframes swimL{from{transform:translateX(calc(100vw + 140px))}to{transform:translateX(-140px)}}
.tongue{transform-origin:65px 73px;animation:pant .7s ease-in-out infinite}
@keyframes pant{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.18)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.bub{position:absolute;bottom:-20px;width:12px;height:12px;border-radius:50%;border:2px solid #7fb8ff;opacity:.5;animation:rise 12s linear infinite}
@keyframes rise{to{transform:translateY(-105vh)}}
.tail{transform-origin:100px 118px;animation:wag 2.4s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@media(prefers-reduced-motion:reduce){.fish,.fish svg,.bub,.tail,.tongue{animation:none}.fish{left:calc(6% + var(--i)*7%)}}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}.dnav h2{flex:1;text-align:center;margin:0;font-size:1.15rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:.85rem}.chip.on{background:var(--pri);color:var(--pri-tx);border-color:var(--pri);font-weight:700}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.stat span{color:var(--mut);font-size:.82rem}.stat b{display:block;font-size:1.9rem;line-height:1.2}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.pbar{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.ychart{display:flex;gap:5px;align-items:flex-end;height:170px}
.ycol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;padding:0;background:none;border:0;color:var(--mut);font-size:.72rem}
.ycol em{font-style:normal;font-size:.72rem;min-height:1em}
.ybar{width:100%;max-width:34px;background:var(--line);border-radius:6px 6px 0 0;display:flex;align-items:flex-end;overflow:hidden}
.ydone{width:100%;background:var(--ok)}
.ycol.on{color:var(--pri);font-weight:700}.ycol.on .ybar{outline:2px solid var(--pri)}
.orow{display:flex;align-items:center;gap:10px;margin-bottom:8px}.oname{width:34%;min-width:80px;font-size:.9rem;word-break:break-word}.onum{width:44px;text-align:right;font-size:.85rem;color:var(--mut)}
@media(max-width:700px){.ycol span{font-size:.62rem}}
@media(max-width:700px){.form{grid-template-columns:1fr 1fr}.form .f-title,.form .f-btn{grid-column:1/-1}.task{flex-direction:column}.acts{justify-content:flex-start}}
</style>
</head>

 </svg>
</div>
<div class="wrap">
  <div class="top">
    <div><h1>📌 To-Do List Board</h1><p class="sub">ทุกคนที่เปิดหน้านี้จะเห็นรายการเดียวกันแบบเรียลไทม์</p><p class="sub" id="dbstat" style="margin-top:-10px">⚪ กำลังเชื่อมต่อฐานข้อมูล…</p></div>
    
  </div>
  <div id="notice"></div>
  <div class="tabs">
    <button class="tab on" data-t="dept">🏫 งานแผนกวิชา<span class="badge" id="b-dept">0</span></button>
    <button class="tab" data-t="personal">👤 งานส่วนตัว<span class="badge" id="b-personal">0</span></button>
    <button class="tab" data-t="dash">📊 แดชบอร์ด</button>
  </div>
  <div id="view"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== วางค่าจาก Firebase Console > Project settings > Your apps (Web) แทนที่ค่าด้านล่าง =====
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyCTkL-ZPdCAS_Hc1WrMPSCIcQAvFXiCeXI",
  authDomain: "task-board-uttc.firebaseapp.com",
  projectId: "task-board-uttc",
  storageBucket: "task-board-uttc.firebasestorage.app",
  messagingSenderId: "758153536686",
  appId: "1:758153536686:web:cd4238149a59bc1d18f93f"
};
</script>
<script>
(function(){
  var tab="dept", unlocked=true, tasks=[], col=null, canWrite=true, showDone=true;
  var $=function(s){return document.querySelector(s)};
  var view=$("#view");

  function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
  function dueDate(t){return new Date(t.due+"T"+(t.time||"23:59")+":00")}
  function fmtDate(t){try{return dueDate(t).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"})}catch(e){return t.due}}
  function status(t){
    var diff=dueDate(t)-new Date();
    if(diff<0)return {c:"over",l:"เลยกำหนด"};
    if(diff<86400000)return {c:"soon",l:"ครบกำหนดใน 24 ชม."};
    if(diff<3*86400000)return {c:"soon",l:"ใกล้ครบกำหนด"};
    return {c:"",l:""};
  }
  function byTab(k){return tasks.filter(function(t){return t.scope===k})}
  var ST=[{k:"doing",l:"กำลังดำเนินการ"},{k:"finished",l:"เสร็จแล้ว"},{k:"submitted",l:"ส่งแล้ว"}];
  function stOf(t){return t.status||(t.done?"submitted":"doing")}
  function pendingCount(k){return byTab(k).filter(function(t){return stOf(t)!=="submitted"}).length}

  function renderBadges(){
    $("#b-dept").textContent=pendingCount("dept");
    $("#b-personal").textContent=unlocked?pendingCount("personal"):"🔒";
  }

  function taskHTML(t){
    var st=stOf(t), sub=st==="submitted";
    var s=sub?{c:"done"}:status(t);
    var lab=ST.filter(function(x){return x.k===st})[0].l;
    var pill='<span class="pill '+(sub?"ok":st==="finished"?"fin":"doing")+'">'+lab+'</span>'+((!sub&&s.l)?'<span class="pill '+s.c+'">'+s.l+'</span>':'');
    var acts=canWrite?ST.map(function(x){return '<button class="sm st-'+x.k+(st===x.k?' cur':'')+'" data-a="set" data-s="'+x.k+'" data-id="'+t.id+'">'+x.l+'</button>'}).join('')+'<button class="sm del" data-a="del" data-id="'+t.id+'">ลบ</button>':'';
    return '<div class="task '+(sub?"done":s.c)+'"><div class="main"><div class="title">'+esc(t.title)+'</div><div class="meta"><span>📅 '+esc(fmtDate(t))+(t.time?' · ⏰ '+esc(t.time)+' น.':'')+'</span><span>👤 '+esc(t.owner||"ไม่ระบุ")+'</span>'+pill+(sub&&t.doneAt?'<span>ส่งเมื่อ '+new Date(t.doneAt).toLocaleString("th-TH",{dateStyle:"medium",timeStyle:"short"})+'</span>':'')+'</div></div><div class="acts">'+acts+'</div></div>';
  }

  var dashY=new Date().getFullYear(), dashM=new Date().getMonth(), dashS="all";
  var THS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  var THF=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  function ymKey(y,m){return y+"-"+(m<9?"0":"")+(m+1)}
  function isDone(t){return stOf(t)==="submitted"}
  function isOver(t){return stOf(t)!=="submitted"&&dueDate(t)<new Date()}

  function renderDash(){
    var pool=tasks.filter(function(t){return dashS==="all"||t.scope===dashS});
    var mt=pool.filter(function(t){return t.due.slice(0,7)===ymKey(dashY,dashM)});
    var total=mt.length, done=mt.filter(isDone).length, pend=total-done, over=mt.filter(isOver).length;
    var rate=total?Math.round(done*100/total):0;
    var mo=[];for(var i=0;i<12;i++){var arr=pool.filter(function(t){return t.due.slice(0,7)===ymKey(dashY,i)});mo.push({t:arr.length,d:arr.filter(isDone).length})}
    var max=Math.max.apply(null,mo.map(function(x){return x.t}).concat([1]));
    var h='<div class="dnav"><button class="sm" data-dn="-1">‹</button><h2>📊 '+THF[dashM]+' '+(dashY+543)+'</h2><button class="sm" data-dn="1">›</button><button class="sm" data-dn="0">เดือนนี้</button></div>';
    h+='<div class="chips">';
    [["all","ทั้งหมด"],["dept","งานแผนกวิชา"],["personal","งานส่วนตัว"]].forEach(function(c){h+='<button class="chip'+(dashS===c[0]?' on':'')+'" data-ds="'+c[0]+'">'+c[1]+'</button>'});
    h+='</div>';
    var nDo=mt.filter(function(t){return stOf(t)==="doing"}).length, nFin=mt.filter(function(t){return stOf(t)==="finished"}).length;
    h+='<div class="dgrid"><div class="stat"><span>งานทั้งหมด</span><b>'+total+'</b></div><div class="stat doing"><span>กำลังดำเนินการ</span><b>'+nDo+'</b></div><div class="stat fin"><span>เสร็จแล้ว</span><b>'+nFin+'</b></div><div class="stat ok"><span>ส่งแล้ว</span><b>'+done+'</b></div><div class="stat bad"><span>เลยกำหนด</span><b>'+over+'</b></div></div>';
    h+='<div class="card"><div class="sec" style="margin:0 0 8px"><h2>ส่งแล้วในเดือนนี้</h2><span class="count">'+rate+'%</span></div><div class="pbar"><i style="width:'+rate+'%"></i></div></div>';
    h+='<div class="card"><div class="sec" style="margin:0 0 10px"><h2>ภาพรวมทั้งปี '+(dashY+543)+'</h2><span class="count">แท่งเขียว = ส่งแล้ว · กดเพื่อเลือกเดือน</span></div><div class="ychart">';
    mo.forEach(function(x,i){var hh=Math.round(x.t/max*100);var dh=x.t?Math.round(x.d*100/x.t):0;
      h+='<button class="ycol'+(i===dashM?' on':'')+'" data-m="'+i+'"><em>'+(x.t||'')+'</em><div class="ybar" style="height:'+(x.t?Math.max(hh,4):2)+'px"><div class="ydone" style="height:'+dh+'%"></div></div><span>'+THS[i]+'</span></button>'});
    h+='</div></div>';
    var by={};mt.forEach(function(t){var k=(t.owner||"").trim()||"ไม่ระบุ";by[k]=by[k]||{t:0,d:0};by[k].t++;if(stOf(t)==="submitted")by[k].d++});
    var ks=Object.keys(by).sort(function(a,b){return by[b].t-by[a].t});
    h+='<div class="card"><div class="sec" style="margin:0 0 10px"><h2>👤 แยกตามผู้รับผิดชอบ</h2><span class="count">'+ks.length+' คน</span></div>';
    h+=ks.length?ks.map(function(k){var o=by[k];return '<div class="orow"><div class="oname">'+esc(k)+'</div><div class="pbar"><i style="width:'+Math.round(o.d*100/o.t)+'%"></i></div><div class="onum">'+o.d+'/'+o.t+'</div></div>'}).join(""):'<div class="empty">ไม่มีงานในเดือนนี้</div>';
    h+='</div>';
    var pl=mt.filter(function(t){return stOf(t)!=="submitted"}).sort(function(a,b){return dueDate(a)-dueDate(b)});
    h+='<div class="sec"><h2>⏳ งานค้างของเดือนนี้</h2><span class="count">'+pl.length+' รายการ</span></div>';
    h+=pl.length?pl.map(taskHTML).join(""):'<div class="empty">'+(total?'🎉 เคลียร์งานเดือนนี้ครบแล้ว':'ไม่มีงานในเดือนนี้')+'</div>';
    view.innerHTML=h;
    view.querySelectorAll("[data-dn]").forEach(function(b){b.onclick=function(){var d=+b.dataset.dn;if(d===0){var n=new Date();dashY=n.getFullYear();dashM=n.getMonth()}else{dashM+=d;if(dashM<0){dashM=11;dashY--}if(dashM>11){dashM=0;dashY++}}renderDash()}});
    view.querySelectorAll("[data-ds]").forEach(function(b){b.onclick=function(){dashS=b.dataset.ds;renderDash()}});
    view.querySelectorAll(".ycol").forEach(function(b){b.onclick=function(){dashM=+b.dataset.m;renderDash()}});
    bind();
  }

  function render(){
    renderBadges();
    document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.t===tab)});
    if(tab==="dash"){renderDash();return}
    if(tab==="personal"&&!unlocked){
      view.innerHTML='<div class="card lock"><div style="font-size:2rem">🔐</div><b>งานส่วนตัว</b><div class="sub">กรอกรหัส 4 หลักเพื่อเข้าดู</div><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"><div class="err" id="perr"></div><button class="btn" id="pinOk">ปลดล็อก</button></div>';
      var go=function(){
        if($("#pin").value===PIN){unlocked=true;try{sessionStorage.setItem("tb-unlock","1")}catch(e){}render()}
        else{$("#perr").textContent="รหัสไม่ถูกต้อง";$("#pin").value="";$("#pin").focus()}
      };
      $("#pinOk").onclick=go;$("#pin").onkeydown=function(e){if(e.key==="Enter")go()};
      return;
    }
    var list=byTab(tab).sort(function(a,b){return dueDate(a)-dueDate(b)});
    var dg=list.filter(function(t){return stOf(t)==="doing"}), fn=list.filter(function(t){return stOf(t)==="finished"}), done=list.filter(function(t){return stOf(t)==="submitted"}).sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0)});
    var h='';
    if(canWrite){
      h+='<div class="card"><div class="form"><div class="f-title"><label for="f-title">งานที่ต้องทำ</label><input id="f-title" maxlength="200" placeholder="เช่น ส่งแผนการสอนภาคเรียนที่ 2"></div><div><label for="f-due">วันที่ต้องส่ง</label><input id="f-due" type="date"></div><div><label for="f-time">เวลา</label><input id="f-time" type="time"></div><div><label for="f-owner">ผู้รับผิดชอบ</label><input id="f-owner" maxlength="80" placeholder="ชื่อผู้รับผิดชอบ"></div><div class="f-btn"><button class="btn" id="add" style="width:100%">＋ เพิ่มงาน</button></div></div><div class="err" id="ferr" style="margin-top:6px"></div></div>';
    }
    h+='<div class="sec"><h2>⏳ กำลังดำเนินการ</h2><span class="count">'+dg.length+' รายการ</span></div>';
    h+=dg.length?dg.map(taskHTML).join(""):'<div class="empty">ไม่มีงานที่กำลังดำเนินการ</div>';
    h+='<div class="sec"><h2>✔️ เสร็จแล้ว</h2><span class="count">'+fn.length+' รายการ</span></div>';
    h+=fn.length?fn.map(taskHTML).join(""):'<div class="empty">ยังไม่มีงานที่เสร็จแล้ว</div>';
    h+='<div class="sec"><h2>📤 ส่งแล้ว</h2><span class="count">'+done.length+' รายการ · <button class="link" id="tgl">'+(showDone?"ซ่อน":"แสดง")+'</button></span></div>';
    if(showDone)h+=done.length?done.map(taskHTML).join(""):'<div class="empty">ยังไม่มีงานที่ส่งแล้ว</div>';
    var keep=captureForm();
    view.innerHTML=h;
    restoreForm(keep);
    bind();
  }

  function captureForm(){var o={};["title","due","time","owner"].forEach(function(k){var e=$("#f-"+k);if(e)o[k]=e.value});return o}
  function restoreForm(o){Object.keys(o).forEach(function(k){var e=$("#f-"+k);if(e)e.value=o[k]})}

  function bind(){
    var add=$("#add");
    if(add)add.onclick=addTask;
    var t=$("#f-title");if(t)t.onkeydown=function(e){if(e.key==="Enter")addTask()};
    var g=$("#tgl");if(g)g.onclick=function(){showDone=!showDone;render()};
    view.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){act(b.dataset.a,b.dataset.id,b.dataset.s)}});
  }

  function fail(e){$("#ferr")&&($("#ferr").textContent="บันทึกไม่สำเร็จ ("+(e&&e.code||"error")+") ลองใหม่อีกครั้ง")}

  function addTask(){
    var title=$("#f-title").value.trim(), due=$("#f-due").value, time=$("#f-time").value, owner=$("#f-owner").value.trim();
    var err=$("#ferr");err.textContent="";
    if(!title){err.textContent="กรุณากรอกชื่องาน";return}
    if(!due){err.textContent="กรุณาเลือกวันที่ต้องส่ง";return}
    var id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    var btn=$("#add");btn.disabled=true;
    col.doc(id).set({scope:tab,title:title,due:due,time:time||"",owner:owner,status:"doing",done:false,doneAt:0,createdAt:Date.now()}).then(function(){
      ["title","due","time"].forEach(function(k){var e=$("#f-"+k);if(e)e.value=""});
      var b=$("#add");if(b)b.disabled=false;var ti=$("#f-title");if(ti)ti.focus();
    }).catch(function(e){var b=$("#add");if(b)b.disabled=false;fail(e)});
  }

  function act(a,id,st){
    var ref=col.doc(id),t=tasks.filter(function(x){return x.id===id})[0];
    if(!t)return;
    if(a==="del"){if(confirm("ลบงาน \""+t.title+"\" ใช่หรือไม่?"))ref.delete().catch(fail)}
    else if(a==="set"){if(stOf(t)===st)return;ref.update({status:st,done:st==="submitted",doneAt:st==="submitted"?Date.now():0}).catch(fail)}
  }

  document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){tab=b.dataset.t;render()}});

  render();

  // Re-evaluate overdue status once a minute (UI only, no writes)
  setInterval(function(){if(!document.activeElement||document.activeElement.tagName!=="INPUT")render()},60000);

  var cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||cfg.apiKey.indexOf("ใส่")===0||typeof firebase==="undefined"){
    canWrite=false;$("#dbstat").textContent="🔴 ยังไม่ได้ตั้งค่า Firebase";
    $("#notice").innerHTML='<div class="note">ยังไม่ได้ใส่ค่า firebaseConfig ในไฟล์ (ดูส่วน FIREBASE_CONFIG ด้านบนของ &lt;script&gt;)</div>';
    render();return;
  }
  try{
    firebase.initializeApp(cfg);
    col=firebase.firestore().collection("tasks");
    col.onSnapshot(function(snap){
      $("#dbstat").textContent="🟢 เชื่อมต่อฐานข้อมูลกลางแล้ว · ทุกเครื่องเห็นข้อมูลเดียวกัน";
      tasks=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x}).filter(function(x){return x.title&&x.due});
      render();
    },function(e){
      canWrite=false;$("#dbstat").textContent="🔴 การเชื่อมต่อฐานข้อมูลขัดข้อง";
      $("#notice").innerHTML='<div class="note">เชื่อมต่อข้อมูลไม่ได้ ('+esc(e&&e.code)+') — ตรวจ Firestore Rules และค่า config</div>';
      render();
    });
  }catch(e){
    canWrite=false;$("#dbstat").textContent="🔴 ค่า config ไม่ถูกต้อง";render();
  }
})();
</script>
</body>
</html>
